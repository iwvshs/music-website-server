local:
  datasource:
    database: vibe_music
    host: localhost
    port: 3306
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: please_set_db_password

  redis:
    host: 127.0.0.1
    port: 6379
    password: please_set_redis_password

  mail:
    host: smtp.qq.com
    username: please_set_mail_username
    password: please_set_mail_password

  minio:
    endpoint: http://localhost:9000
    accessKey: please_set_minio_access_key
    secretKey: please_set_minio_secret_key
    bucket: vibe-music-data

  oss:
    enabled: false
    endpoint: https://oss-cn-hangzhou.aliyuncs.com
    accessKeyId: please_set_oss_access_key_id
    accessKeySecret: please_set_oss_access_key_secret
    bucket: please_set_oss_bucket
    publicDomain: https://please_set_oss_public_domain

  migration:
    minioToOss:
      enabled: false
      dryRun: true
      failFast: false
    urlPrefixReplace:
      enabled: false
      dryRun: true
      failFast: false
      oldPrefix: http://localhost:9000/vibe-music-data/
      newPrefix: https://please_set_oss_public_domain/
